<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fast</title>
    <script>
      // Match system theme before React so the static landing isn't a light flash in dark mode.
      try {
        var pref = localStorage.getItem('fast-ide.theme') || 'system';
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: #fafafa;
        color: #18181b;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      html.dark body {
        background: #09090b;
        color: #fafafa;
      }
      /* Static first paint — visible before the JS bundle mounts React Landing. */
      .boot-landing {
        position: relative;
        display: flex;
        height: 100%;
        width: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
          radial-gradient(120% 80% at 50% -10%, rgba(24, 24, 27, 0.08), transparent 55%),
          #fafafa;
      }
      html.dark .boot-landing {
        background:
          radial-gradient(120% 80% at 50% -10%, rgba(250, 250, 250, 0.08), transparent 55%),
          #09090b;
      }
      .boot-landing__drag {
        position: absolute;
        inset: 0 0 auto 0;
        height: 40px;
        -webkit-app-region: drag;
      }
      .boot-landing__brand {
        margin: 0;
        font-family: ui-serif, Georgia, 'Times New Roman', serif;
        font-size: 2.5rem;
        letter-spacing: -0.02em;
        animation: boot-rise 0.7s ease-out both;
      }
      .boot-landing__status {
        margin: 0.75rem 0 0;
        font-size: 0.875rem;
        opacity: 0.6;
        animation: boot-rise 0.7s ease-out 0.12s both;
      }
      .boot-landing__spin-wrap {
        position: relative;
        width: 2.5rem;
        height: 2.5rem;
        margin-top: 2rem;
        animation: boot-rise 0.7s ease-out 0.24s both;
      }
      .boot-landing__spin-ring {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 1px solid rgba(24, 24, 27, 0.15);
      }
      html.dark .boot-landing__spin-ring {
        border-color: rgba(250, 250, 250, 0.15);
      }
      .boot-landing__spin {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 2px solid transparent;
        border-top-color: rgba(24, 24, 27, 0.75);
        animation: boot-spin 1.1s linear infinite;
      }
      html.dark .boot-landing__spin {
        border-top-color: rgba(250, 250, 250, 0.75);
      }
      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-landing" role="status" aria-live="polite" aria-label="Starting Fast">
        <div class="boot-landing__drag" aria-hidden="true"></div>
        <div style="text-align: center">
          <p class="boot-landing__brand">Fast</p>
          <p class="boot-landing__status">Starting engine…</p>
        </div>
        <div class="boot-landing__spin-wrap" aria-hidden="true">
          <span class="boot-landing__spin-ring"></span>
          <span class="boot-landing__spin"></span>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
