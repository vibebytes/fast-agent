apiVersion: "1"

extensions:
  code-index:
    enabled: true
    apiVersion: "1"
    # config omitted → old codeindex.* chain

  memory:
    enabled: true
    apiVersion: "1"
    config:
      extract: { max-concurrent: 4 }

  mcp:
    enabled: false
    apiVersion: "1"
    config:
      global: { timeout: 30000, retryAttempts: 3, retryDelay: 1000 }
      servers:
        - name: tavily
          enabled: true
          url: "https://mcp.tavily.com/mcp/"
          timeout: 60000
          auth: { type: query, param: tavilyApiKey }
        - name: browser
          enabled: false
          url: "http://localhost:3200/sse"
          timeout: 60000

services:
  embedder: none
  memory.store: lance
