apiVersion: "1"

extensions:
  code-index:
    enabled: false
    apiVersion: "1"
    # config omitted → old codeindex.* chain

  memory:
    enabled: true
    apiVersion: "1"
    config:
      extract: { max-concurrent: 4 }

  mcp:
    enabled: false
    apiVersion: "1"
    config:
      global: { timeout: 120000, retryAttempts: 3, retryDelay: 1000 }
      servers:
        tavily:
          enabled: true
          url: "https://mcp.tavily.com/mcp/"
          timeout: 60000
          auth: { type: query, param: tavilyApiKey }
        browser:
          enabled: false
          url: "http://localhost:3200/sse"
          timeout: 60000
        # stdio form (design §4.3): `command` is the complete argv; `env` is merged onto the whitelist base set.
        # filesystem:
        #   command: [npx, "-y", "@modelcontextprotocol/server-filesystem", /workspace]
        #   cwd: /workspace
        #   env: { LOG_LEVEL: info }

  # 桌面 3D 面板 + vibe3d MCP：root 缺省为 <cwd>/vibe3d，目录不存在则静默停用；
  # 存在但未构建（packages/*/dist/index.js 缺失）会在启动时明确报错。
  vibe3d:
    enabled: true
    apiVersion: "1"
    config:
      openEditor: false
      # root: /Users/you/vibe3d
      # home: ~/.vibe3d/fast

  jev-context:
    enabled: true
    apiVersion: "1"

services:
  embedder: none
  memory.store: lance
